[project]
name = "dueback-mcp-server"
version = "0.1.2"
description = "Model Context Protocol server for Dueback bill negotiation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
dueback-mcp = "server:main"

[build-system]
requires = ["setuptools>=61"]
